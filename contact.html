<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:500px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    animation:fadeIn 1s ease;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#38bdf8;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.1);
    color:white;
}

input:focus,
textarea:focus{
    outline:2px solid #38bdf8;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 20px rgba(56,189,248,.4);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Contact Us</h1>

        <form>
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea rows="5" placeholder="Your Message"></textarea>

            <button type="submit">
                Send Message
            </button>
        </form>
    </div>
</div>

</body>
</html>
